<!DOCTYPE html>
<title>Food Finder</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background: #fff8f0;
        color: #333;
    }

    /* MENU */

    header {
        background: #ff6b00;
        color: white;
        padding: 20px 8%;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    nav h1 {
        font-size: 26px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-weight: bold;
    }

    nav a:hover {
        text-decoration: underline;
    }

    /* INÍCIO */

    .inicio {
        text-align: center;
        padding: 70px 20px;
    }

    .inicio h2 {
        font-size: 42px;
        color: #ff6b00;
        margin-bottom: 15px;
    }

    .inicio p {
        font-size: 18px;
        margin-bottom: 25px;
    }

    .botao {
        display: inline-block;
        background: #ff6b00;
        color: white;
        padding: 12px 25px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    /* COMIDAS */

    section {
        padding: 50px 8%;
    }

    section h2 {
        text-align: center;
        font-size: 30px;
        margin-bottom: 30px;
    }

    .comidas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
    }

    .comida {
        background: white;
        padding: 25px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 3px 12px #00000018;
    }

    .comida span {
        font-size: 45px;
    }

    .comida h3 {
        margin: 12px 0;
        color: #ff6b00;
    }

    /* LUGARES */

    .lugares {
        background: #fff0df;
    }

    .lugar {
        background: white;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 10px;
    }

    .lugar h3 {
        color: #ff6b00;
        margin-bottom: 8px;
    }

    /* RODAPÉ */

    footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 20px;
    }

    /* CELULAR */

    @media (max-width: 600px) {

        nav {
            flex-direction: column;
            gap: 15px;
        }

        nav a {
            margin: 0 8px;
        }

        .inicio h2 {
            font-size: 32px;
        }

    }

</style>
